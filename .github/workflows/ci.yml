name: CI

# Every push, on every branch, plus pull requests so that a PR from a fork is
# covered too. A branch that also has a PR open is therefore built twice; that
# is the price of a branch push being checked before anyone opens the PR, and
# `concurrency` below keeps it to two runs rather than two per commit.
# `workflow_dispatch` stays so a run can still be started by hand.
on:
  push:
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant, and
# a Tauri bundle is far too slow to leave two of them queued.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend — typecheck, lint, format, tests, code health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run check:code-health

      - name: Test the release asset verifier
        run: >-
          node --test
          .github/scripts/verify-no-source-maps.test.mjs
          .github/scripts/vite-source-maps.test.mjs

  rust:
    name: Rust — fmt, clippy, tests, dependency and public-surface checks
    # Not the self-hosted pool: those runners are Ubuntu 20.04, which has no
    # `libwebkit2gtk-4.1-dev` — Tauri v2 needs 4.1, first packaged in 22.04.
    runs-on: ubuntu-latest
    env:
      # `cargo test --workspace` links around forty test binaries, and with the
      # default full DWARF for each it filled the runner's disk — "No space left
      # on device", surfacing first as rust-lld dying with a bus error partway
      # through linking. Line tables keep file and line numbers in panic
      # backtraces, which is all a CI log is ever read for, at a fraction of the
      # size. Incremental state is likewise written once and never reused, since
      # every job starts from the same restored cache.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        # The Rust workspace root is `src-tauri/`, and `rust-toolchain.toml`
        # lives there too — rustup resolves it from the working directory, so
        # every cargo invocation below has to start from here.
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5

      # The image ships an Android SDK, a .NET runtime and a GHC that nothing
      # here uses, and together they are most of a disk this job needs for
      # object files. Reclaiming them is the difference between finishing and
      # "No space left on device" halfway through linking.
      - name: Reclaim the runner's preinstalled toolchains
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      # The shell crate links against the system webview even for `cargo check`,
      # because `tauri-build` and the `*-sys` crates run pkg-config at build
      # time. Without these the workspace does not compile, let alone bundle.
      - name: Install Tauri's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      # No version here: `src-tauri/rust-toolchain.toml` is the one place it is
      # written down, and the no-argument form of this command is what reads it.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Only `main` writes. This is the largest cache in the repo at 1.2 GiB
          # and it was being written twice per commit — once for the push, once
          # for the pull request — against a 10 GiB ceiling the repo had reached,
          # so every branch push evicted somebody's entry by last use. Branch
          # runs still *restore* `main`'s, which is the half that saves time.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install the pinned direct-dependency checker
        run: cargo install cargo-machete --version 0.9.2 --locked

      # Formatting first: it is seconds, and a red format check is a rerun the
      # author can fix before the ten-minute jobs have finished telling them so.
      - run: cargo fmt --all --check

      # `--all-targets` so tests, benches and examples are linted too — most of
      # the workspace's code lives in `tests/`, and it is the half most likely
      # to accumulate the lints `[workspace.lints]` exists to keep out.
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo machete

      - name: Check workspace public surfaces
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - run: cargo test --workspace

  # Attribution is a shipping requirement, not a chore: MIT, BSD and Apache-2.0
  # all ask that their notices travel with the binary, and a dependency added
  # last week is one nobody remembers to add a notice for. So the notice file is
  # regenerated here and the job fails if it differs from the committed copy —
  # which makes "did you update the notices?" a machine's question rather than a
  # reviewer's.
  licences:
    name: Licences — notices current, no incompatible dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # The generator takes the package *set* from the lockfiles but the licence
      # *texts* from the packages themselves, so the trees have to be on disk.
      - run: npm ci

      # Seconds, and it fails on the half of the generator that can be wrong
      # quietly — before the cargo steps below have spent five minutes.
      - name: Test the licence classifier
        run: npm run licences:tool:test

      - name: Install the pinned Rust toolchain
        working-directory: src-tauri
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Its own key: this job compiles nothing, and sharing `rust`'s cache
          # would mean each run evicting the other's.
          key: licences
          # And, for the same reason as the `rust` job, only `main` writes it:
          # four copies of this 170 MiB cache accumulated on 2026-08-05 alone.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Unpacks every crate in `Cargo.lock`, including the ones this runner will
      # never build. Without it the notices are missing the macOS and Windows
      # halves of the graph, which are exactly the ones a Linux developer's
      # local run would also miss.
      - name: Unpack the crate sources
        working-directory: src-tauri
        run: cargo metadata --format-version 1 --locked > /dev/null

      # Two failures, one command: notices that no longer match the lockfiles,
      # and a copyleft or non-commercial licence in the distributed graph.
      - run: npm run licences:check

  # The expensive one, and the reason it is worth having: a `cargo test` that
  # passes says nothing about whether the app still packages. Bundling breakage
  # is otherwise found on release day.
  bundle:
    name: Bundle (${{ matrix.os }})
    # `licences` too: the notice file is a bundled resource, so a bundle built
    # without it is one that cannot legally be handed to anyone.
    needs: [frontend, licences, rust]
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's packaging failure is not a reason to stop finding out
      # about the other two.
      fail-fast: false
      matrix:
        # Linux on every push, because it is the platform the shell crate is
        # developed on and the one most likely to break. macOS and Windows only
        # on `main`, where a slow job costs nobody's iteration loop — three
        # bundles per branch push would make people stop pushing branches.
        os: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') &&
          fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') ||
          fromJSON('["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - if: runner.os == 'Linux'
        name: Install Tauri's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - name: Install the pinned Rust toolchain
        working-directory: src-tauri
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Otherwise this job and `rust` fight over one key while compiling
          # different profiles, and each run evicts the other's cache.
          key: bundle

      - run: npm ci

      - name: Build frontend release assets
        run: npm run build

      - name: Reject source maps from packaged frontend assets
        run: node .github/scripts/verify-no-source-maps.mjs dist

      # `tauri.conf.json` points `beforeBuildCommand` at `npm run build`, so the
      # frontend is typechecked and bundled as part of this. Nothing here signs
      # or notarises: that needs secrets, and it belongs to a release workflow.
      #
      # Which is what the config patch is for. `createUpdaterArtifacts` plus a
      # committed `pubkey` makes the bundler refuse to finish without
      # `TAURI_SIGNING_PRIVATE_KEY` — and it refuses at the very end, after
      # every installer is already built, so the job burned ten minutes to fail
      # on a step it was never meant to run. The patch drops the update payloads
      # this job cannot sign and keeps the installers, which are the thing it
      # exists to prove still package. A failure here also skipped the cache
      # save, so a red bundle job left the next one with nothing to restore.
      - run: npm run tauri build -- --config src-tauri/tauri.ci.conf.json
