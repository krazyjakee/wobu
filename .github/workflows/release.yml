name: Release bundles

# A tag is the release request. The verification job rejects tags that are not
# SemVer or whose version was not stamped into every application manifest.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: Verify release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: node .github/scripts/verify-release-version.mjs "$GITHUB_REF_NAME"

  bundle:
    name: Bundle (${{ matrix.platform }})
    needs: verify-version
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform-specific packaging problem in one run.
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            os: ubuntu-latest
          - platform: macOS
            os: macos-latest
          - platform: Windows x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - if: runner.os == 'Linux'
        name: Install Tauri's system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - name: Install the pinned Rust toolchain
        working-directory: src-tauri
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Deliberately CI's key, not one of this workflow's own. rust-cache
          # composes `v0-rust-<key>-<job id>-<os>-<arch>-<env>-<lockfiles>`, and
          # this job and CI's are both called `bundle`, so matching the `key` is
          # the whole of what makes a tag run restore what CI's bundle job
          # already built on `main` — which a tag run is allowed to do,
          # since a cache created on the default branch is in scope for it.
          # Under its own key it never matched anything: every leg of v0.1.1 and
          # v0.1.2 logged "No cache found" and compiled the graph from scratch,
          # ten to fifteen minutes a platform, where CI's warm bundle takes four.
          #
          # A prefix hit, not a full one — the restore key stops before the
          # lockfile hash — so third-party crates come from the cache and the
          # nine wobu crates rebuild. That is the shape of the win regardless:
          # rust-cache strips workspace artifacts before saving.
          key: bundle
          # Never saves. What it reads is `main`'s cache, and a release writing
          # its own copy under the same key would only crowd out the thing it
          # depends on — the repo already sits near the 10 GiB cache ceiling,
          # where saving evicts by last use. It also puts the 15-40s save on the
          # critical path of the one workflow a person is waiting on.
          save-if: false

      - run: npm ci

      # Tauri packages `dist` as-is. Check it before tauri-action can publish a
      # release containing source maps; the action's repeated build is deterministic.
      - name: Build frontend release assets
        run: npm run build

      - name: Reject source maps from packaged frontend assets
        run: node .github/scripts/verify-no-source-maps.mjs dist

      # Deliberately still no Apple/Windows *code*-signing credentials: bundles
      # remain unsigned manual downloads and Gatekeeper/SmartScreen still warn.
      # The updater keypair below is a separate, narrower trust root — it signs
      # only update payloads, and its public half is committed in
      # `tauri.conf.json`, so a client refuses anything this key did not sign.
      # See docs/12-releasing.md.
      - name: Fail fast when the updater signing key is missing
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Without this the action silently produces a release with no
          # signatures, which every installed client then rejects.
          if [ -z "$KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not set; updates would be unsignable." >&2
            exit 1
          fi

      - name: Build and upload bundles to a published GitHub release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Wobu ${{ github.ref_name }}
          releaseBody: |
            Already running Wobu? **Settings → Updates → Check for updates** installs this
            release in place (AppImage, macOS and Windows builds; `.deb` and `.msi` are
            updated by downloading again).

            For a first install, Wobu beta bundles are not code-signed and must be downloaded
            manually. Read the platform install instructions and security warning in
            [the release guide](https://github.com/${{ github.repository }}/blob/main/docs/12-releasing.md#installing-an-unsigned-beta).
          generateReleaseNotes: true
          # Published, not drafted. `releases/latest/download/latest.json` — the
          # endpoint in `tauri.conf.json` — does not resolve against a draft, so
          # a release left unpublished is one every installed copy polls and
          # silently finds nothing at. A tag is the release request; leaving the
          # result needing a second manual act is what let v0.1.1 sit invisible.
          #
          # What the draft used to buy was a maintainer's look at the assets
          # before anyone could reach them. The gates above replace that with
          # ones that cannot be forgotten: the tag must match every committed
          # manifest, `dist` must carry no source maps, and the signing key must
          # be present. What they do not replace is noticing that a matrix leg
          # failed — `fail-fast: false` means a broken platform now yields a
          # release missing that platform's installer. That degrades to "no
          # update offered there" rather than a bad one, because a client only
          # updates to what `latest.json` actually lists.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # `latest.json` is what installed copies poll. It must be attached to the
          # release for the endpoint in `tauri.conf.json` to resolve.
          includeUpdaterJson: true
