[package]
name = "wobu-jobs"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.91"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
# `time` on top of what was already declared: the wait between attempts is a
# sleep, and the grace a cancelled job gets to wind down is a timeout. Pinned to
# the version already in the workspace lock, which is Tauri's, so this adds no
# second copy — the queue runs on Tauri's runtime and must not bring its own.
tokio = { version = "1.53.1", features = ["sync", "rt", "macros", "time"] }
ulid = { version = "3.0.0", features = ["serde"] }
# For `Cancel`, and for reading a provider failure. See the note on the
# re-export in `lib.rs`: the queue hands the token it creates straight to a
# provider call, and a second token type here would mean every task bridging one
# flag onto another.
wobu-llm = { workspace = true }

[dev-dependencies]
# `test-util` so the backoff can be tested at its real durations without a suite
# that takes half a minute to sleep through them; `rt-multi-thread` because the
# app runs the queue on a multi-threaded runtime, and a queue only ever tested
# on one thread is not the queue that ships.
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "test-util",
    "time",
] }
