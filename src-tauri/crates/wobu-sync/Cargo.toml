[package]
name = "wobu-sync"
version.workspace = true
edition.workspace = true

[dependencies]
# Boxed futures for the two traits this crate asks the app to implement. The
# accept side stores them behind `Arc<dyn _>` — one router serves every peer, so
# the handler cannot be generic over the caller's type without infecting
# `SyncEndpoint` with a parameter that #82's manager would have to carry too.
async-trait = "0.1.91"
# Pinned to the pairing `docs/10-sync-spike.md` compiled and ran: iroh 1.0.3
# against iroh-blobs 0.103.0. Anything else fails at *resolve* time, and one of
# the two failure modes reports an `ed25519-dalek` conflict rather than naming
# iroh at all — see the spike before changing this line. Default features are
# taken as-is because `tls-ring` is one of them and `endpoint::presets` does not
# exist without a crypto provider feature.
iroh = "1.0.3"
# BLAKE3 verified streaming, and the reason `blobs.rs` can move file content
# without this crate acquiring a hash function. The rule in `lib.rs` — if a
# change here needs a cryptographic primitive, the change is wrong — is what
# picked this crate rather than a hand-rolled `(rel_path, hash, bytes)` frame on
# a third ALPN: a receiver that trusted a peer's bytes would have to hash them
# itself to find out it had been lied to, and that is a primitive in this crate.
# `iroh-blobs` verifies the bao tree *as the bytes arrive*, so a peer that serves
# different content under a hash fails the transfer rather than completing it,
# and nothing here computes, compares or stores a digest.
#
# `default-features = false` drops `rpc`, which exists to expose a blob store to
# a *different process* over `noq`. Wobu's store is in-process and there is no
# second process to expose it to, so taking it would add `noq` and `irpc/rpc` to
# the binary for a feature nothing calls. `fs-store` is the one that is kept and
# the one `Blobs` is built on; see `blobs.rs` for why an in-memory store is not
# an option for a project with four gigabytes of assets in it.
#
# Version-locked to `iroh` above and not independently upgradable:
# `docs/10-sync-spike.md` has the pairing table and the two resolver errors,
# one of which names `ed25519-dalek` and never mentions iroh.
iroh-blobs = { version = "0.103.0", default-features = false, features = [
    "fs-store",
] }
# `Ticket` — the trait behind #77's pasteable string: a lowercase kind prefix
# then unpadded base32, with the case folding and the wrong-prefix error already
# written and already tested. Reused rather than hand-rolled so that a Wobu
# ticket *is* an iroh ticket rather than merely resembling one, and so that the
# `EndpointAddr` inside one is encoded by the same mirror-struct pattern
# `EndpointTicket` uses — one place for the address bytes to be decided, not two
# that can drift. Split out of `iroh-base` in 1.0; `iroh_base::ticket` no longer
# exists. Its own dependencies — postcard, data-encoding, n0-error, iroh-base —
# are all already in the lock via iroh itself, so this adds one package.
iroh-tickets = "1.0.0"
# The ticket payload's encoding, called directly rather than through
# `iroh-tickets`, because the *shape* of a Wobu ticket is ours and is versioned
# by `ticket::Wire`. The version `iroh-tickets` already resolves to, so the lock
# unifies rather than carrying two.
postcard = { version = "1.1.3", features = ["use-std"] }
# Thirty-two bytes from the OS for a ticket's grant, and nothing else. This is
# not a cryptographic dependency and must not become the excuse for one — see
# the rule in `lib.rs`. The version `iroh-base` already pulls in, so no second
# `rand` ends up in the binary.
rand = "0.10"
# The peer identity's secret key, in the OS credential store at `wobu/sync`.
# The same crate and the same version the shell's `keys.rs` uses for the BYOK
# provider keys at `wobu/<provider>`, and it has to stay that way: two keyring
# crates in one binary is two credential-store integrations to keep working on
# three platforms, and a Wobu that wrote its identity somewhere its own provider
# keys are not is a Wobu with two answers to "where are my secrets". Default
# features, which is what selects Secret Service / Keychain / Credential Manager.
keyring = "4.1.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Constant-time equality for a bearer capability. Comparing is not a new
# cryptographic protocol, but letting an ordinary early-returning byte compare
# turn the accept path into a timing oracle would leak the credential one byte
# at a time.
subtle = "2.6.1"
thiserror = "2.0.19"
# The spike's headline finding: iroh asks for `tokio ^1.44.1` and the workspace
# is on 1.53.1, so the lock unifies and sync runs on the runtime Tauri already
# started. Declaring the workspace's exact version keeps it that way. A second
# runtime here would mean the endpoint's accept loop living on threads the app
# cannot cancel, which is precisely the shutdown hang #82 has to avoid.
tokio = { version = "1.53.1", features = ["rt", "time", "macros"] }
# For `Id`. The project identifier on the wire is the same ULID the rest of Wobu
# uses for a project, not a sync-local name for one, and a type alias declared
# again here would be a second place for that to stop being true.
wobu-core = { workspace = true }

[dev-dependencies]
# `rt-multi-thread` because two endpoints in one process is two accept loops and
# a current-thread runtime would hide a `Send` bound the app will hit; `sync`
# for the channel the fake session sink is built from.
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }

[lints]
workspace = true
