[package]
name = "wobu-imagine"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = "0.1.91"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
wobu-core.workspace = true
# The reference budget and the role-to-bucket mapping, which #44 put there and
# which `Capabilities` carries unmodified rather than restating.
wobu-influence.workspace = true
# For `Cancel`, and for nothing else — see the re-export in `lib.rs`. The queue
# hands `wobu_llm::Cancel` to every task it runs, so a generate task holding a
# backend either passes that token straight through or bridges one flag onto
# another once per job. It does bring `reqwest` into this crate's dependency
# graph transitively; nothing in `wobu-imagine` reaches it, and the adapters
# that will (#51, #52) need it anyway, at the version already resolved in the
# workspace lock.
wobu-llm.workspace = true

# No `futures-core`: #50 sketches `progress` as a `BoxStream`, and this crate has
# no stream. Progress is a sink for the reasons in `backend.rs`, and an unused
# dependency on a stream crate would read as one being planned.

[dev-dependencies]
# Only to assert the wire form of what the Generate panel and the spend meter
# will read. Nothing in the crate itself has to serialise a request.
serde_json = "1.0.151"
