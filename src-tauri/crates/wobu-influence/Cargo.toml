[package]
name = "wobu-influence"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
wobu-core.workspace = true

[dev-dependencies]
# Only to assert the wire form of what the Inspector will read. Nothing in the
# crate itself serialises, and nothing in it may — it hands borrowed nodes back.
serde_json = "1.0.151"
# `tests/fixtures.rs` reads project folders off disk, and the format they are
# written in belongs to the store. A dev-dependency and never a real one: it is
# not linked into the library, nothing that depends on `wobu-influence` inherits
# it, and `src/` cannot `use` it — so the purity this crate is built around goes
# on being enforced by the compiler rather than by discipline. The alternative,
# a frontmatter parser written inside the test, would be a second reader of the
# format free to drift from the real one and keep passing, which is the drift the
# fixtures exist to catch in the first place.
wobu-store.workspace = true

[lints]
workspace = true
