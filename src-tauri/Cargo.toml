[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
# Inherited by every crate rather than written eight times. `cargo metadata`
# reads this, which is what keeps Wobu's own crates out of the third-party
# notices as *ours* rather than as packages with no licence at all.
license = "MIT"
# Not an aspiration: below this the workspace does not build, because
# `libsqlite3-sys`'s build script uses `cfg_select!`. `rust-toolchain.toml`
# pins the toolchain that is actually used; this is the floor cargo enforces.
rust-version = "1.97"

# Deliberately a short list. CI runs clippy with `-D warnings`, so every lint
# here is one the whole workspace passes today — a group that needs a wall of
# `#[allow]` to compile teaches people to reach for `#[allow]`. `clippy::pedantic`
# was tried and dropped: it wants a `#[must_use]` on 280-odd accessors and an
# `# Errors` section on every fallible function, which is a documentation policy
# rather than a correctness one.
[workspace.lints.rust]
# Nothing in Wobu needs `unsafe`. Deny rather than warn: this is the one lint
# where the right response to a hit is a conversation, not a fix in passing.
unsafe_code = "deny"
# `priority = -1` so a group never outranks a specific lint set beside it.
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Scaffolding that compiles. Each of these is fine in a working tree and is a
# bug on `main`, which is exactly the split between a local run and CI's `-D`.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# `format!("{}", x)` where `format!("{x}")` says the same thing.
uninlined_format_args = "warn"

[workspace.dependencies]
wobu-core = { path = "crates/wobu-core" }
wobu-store = { path = "crates/wobu-store" }
wobu-influence = { path = "crates/wobu-influence" }
wobu-llm = { path = "crates/wobu-llm" }
wobu-imagine = { path = "crates/wobu-imagine" }
wobu-jobs = { path = "crates/wobu-jobs" }
wobu-mcp = { path = "crates/wobu-mcp" }
wobu-sync = { path = "crates/wobu-sync" }

[package]
name = "wobu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local-first, AI-assisted world building for concept art"
default-run = "wobu"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which
# collide on Windows otherwise.
name = "wobu_lib"
crate-type = ["lib", "cdylib", "staticlib"]
# rustdoc cannot build a `--test` harness for a crate that is also a cdylib and
# a staticlib: it fails to resolve the path dependencies and reports them as
# missing crates. There are no doctests in a Tauri shell anyway — the code here
# is command glue, and the behaviour it wraps is tested in wobu-core and
# wobu-store — so turning the harness off is what keeps `cargo test --workspace`
# meaningful rather than red for a reason unrelated to any test.
doctest = false

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1.91"
blake3 = "1.8.5"
chrono = "0.4.45"
# Named directly because `sync/bodies.rs` speaks a protocol on the streams of a
# `wobu_sync::Session`'s connection, and `Connection`, `SendStream` and
# `RecvStream` are iroh's types. Exactly the version `wobu-sync` pins — the
# spike found that anything else fails at resolve time, sometimes while blaming
# `ed25519-dalek` rather than iroh — so the lock unifies and this adds no
# package that was not already in the binary.
iroh = "1.0.3"
keyring = "4.1.5"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# `protocol-asset` is what lets the webview read an image out of the project
# folder by path instead of being handed a base64 copy of every tile in a grid
# (#25). It ships *disabled* — the static scope in `tauri.conf.json` is empty,
# and the only thing that ever widens it is `commands::adopt`, per project, at
# open.
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
# The updater installs a new bundle over the running one, which only takes
# effect on the next launch. `process` is what lets the user take that launch
# immediately instead of being told to quit and reopen by hand.
tauri-plugin-process = "2"
# Signed in-app updates. The plugin refuses any payload whose signature does not
# verify against the public key committed in `tauri.conf.json`, so the trust root
# is this repository rather than the HTTPS connection to GitHub.
tauri-plugin-updater = "2"
# The runtime Tauri already started, named here so `sync.rs` can put a deadline
# on a network step and a channel between the poller and the manager. The exact
# version `wobu-sync` declares, so the lock unifies and there is one runtime in
# the binary rather than two — a second one would put the sync accept loop on
# threads the app cannot cancel, which is the shutdown hang #82 exists to avoid.
tokio = { version = "1.53.1", features = [
    "rt",
    "rt-multi-thread",
    "time",
    "macros",
    "sync",
    "process",
    "io-util",
    # `signal` for #143: a logout or a `systemctl stop` sends SIGTERM, which by
    # default kills the process where it stands — orphaning whatever paid job
    # was in flight and leaving our presence entry on the share. `shutdown.rs`
    # catches it and takes the ordinary exit path instead.
    "signal",
] }
url = "2.5.8"
wobu-core = { workspace = true }
wobu-influence = { workspace = true }
wobu-imagine = { workspace = true }
wobu-jobs = { workspace = true }
wobu-llm = { workspace = true }
# #140. Nothing in this crate opens a socket or spawns a process until the user
# turns it on in Settings; `mcp.rs` is the only thing that can, and it is handed
# an explicit flag to do it with.
wobu-mcp = { workspace = true }
wobu-store = { workspace = true }
wobu-sync = { workspace = true }

[dev-dependencies]
# #85 deliberately drops one simulated peer's sync-state table between rounds.
# Match wobu-store's exact SQLite binding so the workspace still links one
# bundled SQLite and the test opens the same on-disk format as the app.
rusqlite = { version = "0.40.1", features = ["bundled"] }
